<!DOCTYPE html>
<html>
<head>
    <title>WhatsApp Number Checker</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-lg max-w-md w-full">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">WhatsApp Number Checker</h1>
        
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Upload CSV File:</label>
            <input type="file" id="fileInput" accept=".csv" 
                   class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <button onclick="uploadFile()" 
                class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg transition duration-200"
                id="submitBtn">
            Check Numbers
        </button>

        <div id="result" class="mt-4 text-center"></div>
    </div>

    <script>
        async function uploadFile() {
            const file = document.getElementById('fileInput').files[0];
            const resultDiv = document.getElementById('result');
            const btn = document.getElementById('submitBtn');
            
            if (!file) {
                resultDiv.innerHTML = '<p class="text-red-500">Please select a CSV file first!</p>';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = 'Processing...';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/check', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) throw new Error('Server error');
                
                const data = await response.json();
                if (data.download_url) {
                    resultDiv.innerHTML = `
                        <a href="${data.download_url}" download
                           class="text-green-600 hover:text-green-700 underline">
                            Download Results
                        </a>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="text-red-500">Error: ${error.message}</p>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Check Numbers';
            }
        }
    </script>
</body>
</html>
